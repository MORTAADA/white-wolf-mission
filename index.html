<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes" />
  <title>White Wolf Scholar</title>
  <!-- PWA Meta Tags & Manifest -->
  <link rel="manifest" href="./manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="White Wolf Scholar" />
  <meta name="mobile-web-app-capable" content="yes" />
  <style>
    /* ===== RESET & BASE ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0a0e14;
      color: #e2e8f0;
      padding-bottom: 80px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }
    a, button, .clickable {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    button {
      background: none;
      border: none;
      color: inherit;
      font: inherit;
      padding: 6px 12px;
      border-radius: 8px;
      touch-action: manipulation;
      transition: all 0.2s ease;
    }
    button:active { transform: scale(0.95); }
    input, select, textarea {
      font: inherit;
      background: #141c26;
      border: 1px solid #2a3442;
      color: #e2e8f0;
      border-radius: 10px;
      padding: 12px 14px;
      width: 100%;
      font-size: 16px;
      outline: none;
      transition: border 0.2s;
    }
    input:focus, select:focus, textarea:focus { border-color: #4b7bec; }
    textarea { resize: vertical; min-height: 70px; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #121a24; }
    ::-webkit-scrollbar-thumb { background: #2f3d52; border-radius: 10px; }

    /* ===== LAYOUT ===== */
    .app {
      width: 100%;
      max-width: 780px;
      padding: 16px 18px 90px;
    }

    @media (min-width: 900px) {
      .app { padding: 24px 30px 90px; max-width: 860px; }
      .bottom-nav { display: none; }
      body { padding-bottom: 0; }
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0 12px;
      border-bottom: 1px solid #1e2733;
      margin-bottom: 24px;
    }
    .header h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(135deg, #c0d0f0, #7a9bcb);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .header h1 span {
      font-weight: 300;
      -webkit-text-fill-color: #6b7f9a;
      font-size: 18px;
    }
    .wolf-icon {
      font-size: 30px;
      -webkit-text-fill-color: initial;
      color: #c0d0f0;
    }

    /* ===== SETTINGS GEAR ===== */
    .settings-btn {
      font-size: 22px;
      color: #6b7f9a;
      cursor: pointer;
      padding: 4px;
      border-radius: 50%;
      transition: all 0.2s ease;
    }
    .settings-btn:hover { color: #c0d0f0; background: #1a2430; }
    .settings-dropdown {
      position: absolute;
      top: 50px;
      right: 10px;
      background: #111a24;
      border: 1px solid #1d2735;
      border-radius: 14px;
      padding: 8px 0;
      min-width: 220px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.6);
      z-index: 150;
      display: none;
    }
    .settings-dropdown.open { display: block; }
    .settings-dropdown .item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      color: #c8d6e5;
      cursor: pointer;
      transition: background 0.15s;
    }
    .settings-dropdown .item:hover { background: #1a2430; }
    .settings-dropdown .item .icon { font-size: 18px; }
    .settings-dropdown .divider { height: 1px; background: #1a2430; margin: 4px 16px; }
    .settings-dropdown .item .toggle-status {
      margin-left: auto;
      font-size: 12px;
      color: #6b7f9a;
    }

    /* ===== BOTTOM NAV ===== */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(14, 20, 28, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid #222b38;
      display: flex;
      justify-content: space-around;
      padding: 8px 0 env(safe-area-inset-bottom, 8px);
      z-index: 100;
    }
    .bottom-nav button {
      flex: 1;
      text-align: center;
      font-size: 11px;
      padding: 6px 0;
      color: #6b7f9a;
      border-radius: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }
    .bottom-nav button.active { color: #8fb3e6; font-weight: 600; }
    .bottom-nav button .nav-icon { font-size: 24px; line-height: 1; }

    /* ===== CARDS ===== */
    .card {
      background: #111a24;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 18px;
      border: 1px solid #1d2735;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .card-title {
      font-size: 16px;
      font-weight: 600;
      color: #c8d6e5;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card-title .badge {
      font-size: 12px;
      font-weight: 500;
      background: #1f2a3a;
      padding: 2px 12px;
      border-radius: 30px;
      color: #8ba2c0;
    }

    /* ===== STATUS COLORS ===== */
    .status-0 { color: #5a6f86; }
    .status-1 { color: #e89c6a; }
    .status-2 { color: #e8cc6a; }
    .status-3 { color: #6a9ce8; }
    .status-4 { color: #6ae8a5; }

    /* ===== PROGRESS BAR ===== */
    .progress-bar { height: 6px; background: #1f2a3a; border-radius: 20px; overflow: hidden; margin: 8px 0; }
    .progress-bar .fill { height: 100%; border-radius: 20px; transition: width 0.4s; background: #4b7bec; }
    .progress-bar .fill.weak { background: #e86a6a; }
    .progress-bar .fill.medium { background: #e8cc6a; }
    .progress-bar .fill.strong { background: #6ae8a5; }

    /* ===== SUBJECT GRID ===== */
    .subject-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .subject-card { background: #0e161f; border-radius: 16px; padding: 16px 14px; border-left: 4px solid #2a3a4a; cursor: pointer; transition: all 0.2s ease; border: 1px solid #1a2430; }
    .subject-card:active { background: #182230; transform: scale(0.98); }
    .subject-card h4 { font-size: 14px; font-weight: 600; margin-bottom: 6px; line-height: 1.2; color: #e2e8f0; }
    .subject-card .sub-meta { font-size: 12px; color: #6b7f9a; display: flex; justify-content: space-between; }

    /* ===== TOPIC LIST ===== */
    .topic-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #16202c; }
    .topic-item:last-child { border-bottom: 0; }
    .topic-item .left { display: flex; flex-direction: column; gap: 2px; }
    .topic-item .left .name { font-size: 15px; font-weight: 500; }
    .topic-item .left .sub { font-size: 12px; color: #6b7f9a; }
    .topic-item .right { display: flex; align-items: center; gap: 8px; }

    /* ===== TASK ITEM ===== */
    .task-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #16202c; }
    .task-item:last-child { border-bottom: 0; }
    .task-item .task-left { display: flex; flex-direction: column; gap: 2px; }
    .task-item .task-left .task-text { font-size: 15px; font-weight: 500; }
    .task-item .task-left .task-meta { font-size: 12px; color: #6b7f9a; }
    .task-item .task-right { display: flex; align-items: center; gap: 8px; }
    .task-item .task-priority { font-size: 11px; padding: 2px 10px; border-radius: 20px; font-weight: 500; }
    .task-priority.Haute { background: #3d1f1f; color: #e86a6a; }
    .task-priority.Moyenne { background: #3d351f; color: #e8cc6a; }
    .task-priority.Basse { background: #1f2a3a; color: #8ba2c0; }
    .task-done { text-decoration: line-through; opacity: 0.6; }

    /* ===== EXAM ITEM ===== */
    .exam-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #16202c; }
    .exam-item:last-child { border-bottom: 0; }
    .exam-item .exam-left { display: flex; flex-direction: column; gap: 2px; }
    .exam-item .exam-left .exam-title { font-size: 15px; font-weight: 500; }
    .exam-item .exam-left .exam-date { font-size: 12px; color: #6b7f9a; }
    .exam-item .exam-right { display: flex; align-items: center; gap: 8px; }
    .exam-item .exam-badge { font-size: 11px; padding: 2px 10px; border-radius: 20px; background: #1f2a3a; color: #e8cc6a; }

    /* ===== POMODORO ===== */
    .pomodoro-container { text-align: center; padding: 10px 0; }
    .pomodoro-container .timer-display { font-size: 48px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: 2px; margin: 8px 0; color: #c8d6e5; }
    .pomodoro-container .timer-controls { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; margin: 12px 0 4px; }
    .pomodoro-container .timer-controls button { padding: 8px 18px; font-weight: 500; border: 1px solid #2a3442; border-radius: 10px; }
    .pomodoro-container .timer-controls .btn-start { border-color: #4b7bec; color: #8fb3e6; }
    .pomodoro-container .timer-controls .btn-start.running { border-color: #e8cc6a; color: #e8cc6a; }
    .pomodoro-container .timer-controls .btn-stop { border-color: #e86a6a; color: #e86a6a; }
    .pomodoro-container .timer-controls .btn-reset { border-color: #6b7f9a; color: #6b7f9a; }
    .pomodoro-container .timer-settings { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px 15px; margin-top: 12px; align-items: center; }
    .pomodoro-container .timer-settings label { font-size: 13px; color: #6b7f9a; display: flex; align-items: center; gap: 6px; }
    .pomodoro-container .timer-settings input[type="number"] { width: 50px; padding: 4px 6px; font-size: 14px; background: #0a0e14; border: 1px solid #2a3442; border-radius: 6px; color: #e2e8f0; text-align: center; }

    /* ===== EMPLOI DU TEMPS ===== */
    .schedule-day { margin-bottom: 12px; }
    .schedule-day h4 { color: #c8d6e5; margin-bottom: 6px; border-bottom: 1px solid #1a2430; padding-bottom: 4px; }
    .schedule-item { display: flex; justify-content: space-between; padding: 4px 0; font-size: 14px; border-bottom: 1px solid #111a24; }
    .schedule-item .subj { color: #e2e8f0; }
    .schedule-item .time { color: #6b7f9a; }
    .schedule-item .room { color: #8ba2c0; font-size: 12px; }
    .schedule-item .type { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: #1a2430; color: #8ba2c0; }
    .schedule-item .type.Cours { background: #1f2a4a; color: #8fb3e6; }
    .schedule-item .type.TD { background: #2a3a2a; color: #8ba25a; }
    .schedule-item .type.TP { background: #3a2a3a; color: #c08ae6; }

    /* ===== PROGRAMMING CATEGORIES ===== */
    .prog-category { background: #0e161f; border-radius: 16px; padding: 12px 16px; margin-bottom: 14px; border: 1px solid #1a2430; }
    .prog-category .cat-header { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 16px; color: #c8d6e5; margin-bottom: 6px; }
    .prog-category .cat-header .cat-icon { font-size: 20px; }
    .prog-category .cat-header .cat-count { margin-left: auto; font-size: 12px; color: #6b7f9a; background: #1a2430; padding: 2px 10px; border-radius: 20px; }

    /* ===== BUTTONS ===== */
    .btn-primary { background: #2a3f60; color: #e2e8f0; padding: 10px 20px; border-radius: 12px; font-weight: 500; display: inline-flex; align-items: center; gap: 8px; border: 1px solid #3a557a; }
    .btn-primary:active { background: #1f3350; }
    .btn-outline { border: 1px solid #2a3442; padding: 6px 14px; border-radius: 10px; font-size: 13px; color: #8ba2c0; }
    .btn-outline:active { background: #1a2430; }
    .btn-small { padding: 4px 12px; font-size: 13px; border-radius: 8px; }
    .btn-ignore { color: #e86a6a; border-color: #3d1f1f; }
    .btn-ignore:active { background: #1f0f0f; }

    /* ===== MODAL ===== */
    .modal-overlay { 
      position: fixed; 
      inset: 0; 
      background: rgba(0,0,0,0.8); 
      backdrop-filter: blur(4px); 
      display: flex; 
      align-items: flex-start; 
      justify-content: center; 
      z-index: 200; 
      padding: 20px; 
      padding-top: 10vh; 
    }
    .modal-content { 
      background: #111a24; 
      border-radius: 24px 24px 20px 20px; 
      max-width: 500px; 
      width: 100%; 
      max-height: 90vh; 
      overflow-y: auto; 
      padding: 24px 20px; 
      border: 1px solid #1d2735; 
      position: relative;
    }
    .modal-content .close-btn {
      position: absolute;
      top: 12px;
      right: 16px;
      font-size: 20px;
      color: #6b7f9a;
      cursor: pointer;
      padding: 4px;
    }
    .modal-content .close-btn:hover { color: #e86a6a; }
    .modal-content h3 { font-size: 20px; margin-bottom: 16px; padding-right: 30px; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

    /* ===== STATS ===== */
    .stat-row { display: flex; justify-content: space-between; padding: 8px 0; font-size: 14px; border-bottom: 1px solid #16202c; }
    .stat-row .label { color: #6b7f9a; }
    .stat-row .value { font-weight: 500; }

    .chip { display: inline-block; background: #1a2430; padding: 3px 12px; border-radius: 30px; font-size: 12px; color: #8ba2c0; }

    /* ===== PLANNING EDIT ===== */
    .planning-day-edit { background: #0e161f; border-radius: 12px; padding: 14px; margin-bottom: 12px; border: 1px solid #1a2430; }
    .planning-day-edit .day-header { display: flex; justify-content: space-between; align-items: center; font-weight: 600; margin-bottom: 8px; }
    .planning-day-edit input { background: #0a0e14; border: 1px solid #1a2430; padding: 8px 12px; border-radius: 8px; color: #e2e8f0; width: 100%; font-size: 14px; }

    /* ===== RESOURCES CARD ===== */
    .resource-group-title { font-weight: 600; font-size: 16px; color: #c8d6e5; margin: 12px 0 6px; }
    .resource-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid #16202c; }
    .resource-item:last-child { border-bottom: 0; }
    .resource-item .left { display: flex; flex-direction: column; gap: 2px; }
    .resource-item .left .title { font-size: 15px; font-weight: 500; }
    .resource-item .left .meta { font-size: 12px; color: #6b7f9a; }
    .resource-item .right { display: flex; align-items: center; gap: 6px; }

    /* ===== RESPONSIVE ===== */
    @media (min-width: 600px) {
      .app { padding: 20px 24px 90px; }
      .subject-grid { grid-template-columns: 1fr 1fr 1fr; }
      .bottom-nav button { font-size: 13px; gap: 4px; }
    }
    @media (min-width: 900px) {
      .app { max-width: 860px; padding: 30px 40px 90px; }
      .subject-grid { grid-template-columns: 1fr 1fr 1fr; }
      .bottom-nav { display: none; }
      body { padding-bottom: 0; }
    }

    /* ===== UTILITY ===== */
    .flex { display: flex; }
    .flex-between { display: flex; justify-content: space-between; align-items: center; }
    .gap-8 { gap: 8px; }
    .gap-12 { gap: 12px; }
    .mt-8 { margin-top: 8px; }
    .mt-16 { margin-top: 16px; }
    .mb-8 { margin-bottom: 8px; }
    .text-center { text-align: center; }
    .text-muted { color: #6b7f9a; }
    .text-small { font-size: 13px; }
    .text-bold { font-weight: 600; }
    .hidden { display: none !important; }

    /* ===== ONBOARDING ===== */
    .onboarding-step { padding: 16px 0; }
    .onboarding-step h2 { font-size: 24px; margin-bottom: 12px; }
    .onboarding-step p { color: #8ba2c0; line-height: 1.6; }

    /* ===== SCHEDULE CARD ===== */
    .schedule-status-container { display: flex; flex-direction: column; gap: 6px; }
    .schedule-status-item { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 8px; background: #0e161f; border: 1px solid #1a2430; }
    .schedule-status-item .status-icon { font-size: 20px; }
    .schedule-status-item .status-text { font-size: 14px; font-weight: 500; }
    .schedule-status-item .status-sub { font-size: 12px; color: #6b7f9a; }

    /* ===== SMART REVISION (COLLAPSIBLE) ===== */
    .revision-group {
      background: #0e161f;
      border-radius: 12px;
      margin-bottom: 10px;
      border: 1px solid #1a2430;
      overflow: hidden;
    }
    .revision-group-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      cursor: pointer;
      user-select: none;
    }
    .revision-group-header:active { background: #182230; }
    .revision-group-header .group-title { font-weight: 600; font-size: 15px; }
    .revision-group-header .group-meta { font-size: 12px; color: #6b7f9a; }
    .revision-group-body {
      padding: 0 14px 12px 14px;
      display: none;
      border-top: 1px solid #1a2430;
    }
    .revision-group-body.open { display: block; }
    .revision-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #111a24;
    }
    .revision-item:last-child { border-bottom: 0; }
    .revision-item .left { display: flex; align-items: center; gap: 8px; }
    .revision-item .left .priority-icon { font-size: 16px; }
    .revision-item .left .name { font-size: 14px; }
    .revision-item .left .sub { font-size: 12px; color: #6b7f9a; }
    .revision-item .right { display: flex; gap: 6px; }
  </style>
</head>

    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = (ev) => {
          const d = ev.target.result;
          if (!d.objectStoreNames.contains(STORE_NAME)) {
            d.createObjectStore(STORE_NAME, { keyPath: 'key' });
          }
        };
        req.onsuccess = (ev) => { db = ev.target.result; resolve(db); };
        req.onerror = (ev) => reject(ev.target.error);
      });
    }

    async function dbGet(key) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readonly');
        const store = tx.objectStore(STORE_NAME);
        const req = store.get(key);
        req.onsuccess = () => resolve(req.result ? req.result.value : null);
        req.onerror = () => reject(req.error);
      });
    }

    async function dbSet(key, value) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        const req = store.put({ key, value });
        req.onsuccess = () => resolve();
        req.onerror = () => reject(req.error);
      });
    }

    function getScheduleStatus() {
      const now = new Date();
      const dayNames = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
      const today = dayNames[now.getDay()];
      const currentMinutes = now.getHours() * 60 + now.getMinutes();

      const todayClasses = COURSE_SCHEDULE.filter(c => c.day === today);

      let currentClass = null;
      let nextClass = null;

      for (let c of todayClasses) {
        const start = parseInt(c.start.split(':')[0]) * 60 + parseInt(c.start.split(':')[1]);
        const end = parseInt(c.end.split(':')[0]) * 60 + parseInt(c.end.split(':')[1]);

        if (currentMinutes >= start && currentMinutes < end) {
          currentClass = c;
        }
      }

      for (let c of todayClasses) {
        const start = parseInt(c.start.split(':')[0]) * 60 + parseInt(c.start.split(':')[1]);
        if (currentMinutes < start) {
          if (!nextClass || start < parseInt(nextClass.start.split(':')[0]) * 60 + parseInt(nextClass.start.split(':')[1])) {
            nextClass = c;
          }
        }
      }

      return { currentClass, nextClass, todayClasses };
    }

    // ---------- SMART REVISION ENGINE ----------
    function computeSmartRevision() {
      const now = Date.now();
      const recommendations = [];
      const ignoreThreshold = 48 * 60 * 60 * 1000; // 48 hours

      state.topics.forEach(topic => {
        const ignoredUntil = state.ignoredTopics[topic.id];
        if (ignoredUntil && now < ignoredUntil) return;

        const p = getProgress(topic.id);
        const lastStudied = p.last_studied ? new Date(p.last_studied).getTime() : 0;
        const daysSinceLastStudy = Math.floor((now - lastStudied) / 86400000);
        const errorsInTopic = state.errors.filter(e => e.topic_id === topic.id).length;

        let urgency = 0;
        urgency += daysSinceLastStudy * 0.5;
        urgency += (4 - p.level) * 5;
        urgency += errorsInTopic * 3;

        const lastTests = state.sessions.filter(s => s.topic_id === topic.id && s.type === 'test');
        if (lastTests.length > 0) {
          const avgScore = lastTests.reduce((sum, s) => sum + (s.score || 0), 0) / lastTests.length;
          if (avgScore < 60) urgency += 10;
        }

        if (urgency > 8 && daysSinceLastStudy > 0) {
          recommendations.push({
            topicId: topic.id,
            subjectId: topic.subject_id,
            title: topic.title,
            level: p.level,
            daysSinceLastStudy: daysSinceLastStudy,
            errors: errorsInTopic,
            urgency: urgency
          });
        }
      });

      PROGRAMMING_TOPICS.forEach(topic => {
        const ignoredUntil = state.ignoredTopics[topic.id];
        if (ignoredUntil && now < ignoredUntil) return;

        const p = state.programming[topic.id] || { level: 0 };
        if (p.level < 3 && p.level > 0) {
          recommendations.push({
            topicId: topic.id,
            subjectId: 'programming',
            title: topic.title,
            level: p.level,
            daysSinceLastStudy: 0,
            errors: 0,
            urgency: (4 - p.level) * 5 + 5
          });
        }
      });

      recommendations.sort((a, b) => b.urgency - a.urgency);

      const grouped = {};
      recommendations.forEach(r => {
        const key = r.subjectId;
        if (!grouped[key]) grouped[key] = [];
        grouped[key].push(r);
      });

      return grouped;
    }

    // ---------- REMINDER ENGINE ----------
    function checkReminders() {
      const now = new Date();
      const nowMinutes = now.getHours() * 60 + now.getMinutes();
      const nowTimestamp = now.getTime();

      const dayNames = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
      const today = dayNames[now.getDay()];
      const todayClasses = COURSE_SCHEDULE.filter(c => c.day === today);

      todayClasses.forEach(c => {
        const startMinutes = parseInt(c.start.split(':')[0]) * 60 + parseInt(c.start.split(':')[1]);
        const diff = startMinutes - nowMinutes;
        if (diff > 0 && diff <= 10) {
          const key = `${c.subject}_${c.start}`;
          if (state.lastNotifiedClass !== key) {
            state.lastNotifiedClass = key;
            sendNotification(`⏰ Cours dans 10 min`, `${c.subject} (${c.type}) à ${c.start} • ${c.room}`);
          }
        }
      });

      state.exams.forEach(exam => {
        const examDateTime = new Date(`${exam.date}T${exam.time || '00:00'}`);
        const diffDays = Math.floor((examDateTime.getTime() - nowTimestamp) / 86400000);
        const diffHours = (examDateTime.getTime() - nowTimestamp) / (1000 * 60 * 60);

        if (diffDays === 3) {
          const key = `${exam.id}_3days`;
          if (state.lastNotifiedExam !== key) {
            state.lastNotifiedExam = key;
            sendNotification(`📝 Examen dans 3 jours !`, `${exam.title} - Préparez-vous !`);
          }
        }

        if (diffHours > 0 && diffHours <= 1 && diffHours > 0.5) {
          const key = `${exam.id}_1hour`;
          if (state.lastNotifiedExamHour !== key) {
            state.lastNotifiedExamHour = key;
            sendNotification(`⏰ Examen dans 1 heure !`, `${exam.title} - Bonne chance !`);
          }
        }
      });
    }

      const overall = totalTopics ? Math.round((progressed / totalTopics) * 100) : 0;
      const totalSessions = state.sessions.length;
      const todayTasks = getTasksForToday();

      const mins = Math.floor(pomodoro.remaining / 60);
      const secs = pomodoro.remaining % 60;
      const displayTime = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      const isRunning = pomodoro.isRunning;
      const isBreak = pomodoro.isBreak;

      const { currentClass, nextClass } = getScheduleStatus();

      const groupedRevisions = computeSmartRevision();
      const hasRevisions = Object.keys(groupedRevisions).length > 0;

      return `
        <div>
          <div class="card" style="padding:14px;">
            <div class="card-title" style="margin-bottom:8px;">📋 Emploi du temps</div>
            <div class="schedule-status-container">
              ${currentClass ? `
                <div class="schedule-status-item">
                  <div class="status-icon">🔴</div>
                  <div>
                    <div class="status-text">En cours : ${currentClass.subject}</div>
                    <div class="status-sub">${currentClass.start} - ${currentClass.end} • ${currentClass.room || currentClass.type === 'TP' ? 'Labo de chimie' : ''}</div>
                  </div>
                </div>
              ` : ''}
              
              ${nextClass ? `
                <div class="schedule-status-item" style="border-color: #2a3f60;">
                  <div class="status-icon">⏳</div>
                  <div>
                    <div class="status-text">Prochain : ${nextClass.subject}</div>
                    <div class="status-sub">À ${nextClass.start} • ${nextClass.room || (nextClass.type === 'TP' ? 'Labo de chimie' : '')}</div>
                  </div>
                </div>
              ` : `
                <div class="schedule-status-item">
                  <div class="status-icon">☕</div>
                  <div>
                    <div class="status-text">Aucun cours prévu aujourd'hui</div>
                    <div class="status-sub">Profitez de votre temps libre !</div>
                  </div>
                </div>
              `}
            </div>
          </div>

          <div class="card">
            <div class="card-title">Progression globale <span class="badge">${overall}%</span></div>
            <div class="progress-bar"><div class="fill" style="width:${overall}%;${overall<30?'background:#e86a6a;':overall<60?'background:#e8cc6a;':'background:#6ae8a5;'}"></div></div>
            <div class="flex-between text-small" style="margin-top:6px;">
              <span>${progressed} / ${totalTopics} chapitres</span>
              <span>${totalSessions} sessions</span>
            </div>
          </div>

          <div class="card">
            <div class="card-title">📋 Mes tâches du jour <span class="badge">${new Date().toLocaleDateString('fr-FR')}</span></div>
            ${todayTasks.length ? todayTasks.map(t => `
              <div class="task-item">
                <div class="task-left">
                  <span class="task-text">${t.text}</span>
                  <span class="task-meta">${t.time || ''} • ${t.priority}</span>
                </div>
                <div class="task-right">
                  <span class="task-priority ${t.priority}">${t.priority}</span>
                  <button class="btn-small btn-outline" data-task-done="${t.id}">✅</button>
                  <button class="btn-small btn-outline" data-task-delete="${t.id}">🗑️</button>
                </div>
              </div>
            `).join('') : '<div class="text-muted text-small">Aucune tâche pour aujourd\'hui. Ajoutez-en une dans Planning.</div>'}
          </div>

          ${hasRevisions && state.settings.showSmartRevision ? `
          <div class="card" id="smart-revision-card">
            <div class="card-title">🧠 À réviser maintenant <span class="badge">${Object.values(groupedRevisions).reduce((a, b) => a + b.length, 0)}</span></div>
            ${Object.keys(groupedRevisions).map(subjectId => {
              const items = groupedRevisions[subjectId];
              const subjectName = subjectId === 'programming' ? '💻 Programmation' : (state.subjects.find(s => s.id === subjectId)?.name || 'Matière');
              const totalUrgency = items.reduce((sum, i) => sum + i.urgency, 0);
              const avgUrgency = totalUrgency / items.length;
              let groupColor = '🟢';
              if (avgUrgency > 30) groupColor = '🔴';
              else if (avgUrgency > 15) groupColor = '🟡';

              return `
                <div class="revision-group" id="group-${subjectId}">
                  <div class="revision-group-header" data-group-toggle="${subjectId}">
                    <div>
                      <span class="group-title">${groupColor} ${subjectName}</span>
                      <span class="group-meta"> • ${items.length} chapitre${items.length > 1 ? 's' : ''}</span>
                    </div>
                    <span class="group-meta">▼</span>
                  </div>
                  <div class="revision-group-body" id="body-${subjectId}">
                    ${items.map(r => {
                      let icon = '🟢';
                      if (r.urgency > 30) icon = '🔴';
                      else if (r.urgency > 15) icon = '🟡';

                      return `
                        <div class="revision-item" id="rev-item-${r.topicId}">
                          <div class="left">
                            <span class="priority-icon">${icon}</span>
                            <div>
                              <div class="name">${r.title}</div>
                              <div class="sub">
                                ${r.daysSinceLastStudy > 0 ? `📅 ${r.daysSinceLastStudy} jours` : ''}
                                ${r.level !== undefined ? ` • Niveau ${r.level}/4` : ''}
                                ${r.errors > 0 ? ` • ❌ ${r.errors} erreurs` : ''}
                              </div>
                            </div>
                          </div>
                          <div class="right">
                            <button class="btn-small btn-outline" data-session-topic="${r.topicId}">🔄 Réviser</button>
                            <button class="btn-small btn-ignore btn-outline" data-ignore-topic="${r.topicId}">❌</button>
                          </div>
                        </div>
                      `;
                    }).join('')}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
          ` : ''}

          <div class="card">
            <div class="card-title">⏱️ Minuteur Pomodoro <span class="badge">${isBreak ? '☕ Pause' : '📖 Travail'}</span></div>
            <div class="pomodoro-container">
              <div class="timer-display">${displayTime}</div>
              <div class="timer-controls">
                ${!isRunning ? `<button class="btn-start" data-pomo-start>▶️ Démarrer</button>` : `<button class="btn-start running" data-pomo-pause>⏸️ Pause</button>`}
                <button class="btn-stop" data-pomo-stop>⏹️ Arrêter</button>
                <button class="btn-reset" data-pomo-reset>↺ Reset</button>
              </div>
              <div class="timer-settings">
                <label>🎯 Travail: <input type="number" id="pomo-work" value="${pomodoro.workTime}" min="1" max="120" ${isRunning ? 'disabled' : ''} /> min</label>
                <label>☕ Pause: <input type="number" id="pomo-break" value="${pomodoro.breakTime}" min="1" max="30" ${isRunning ? 'disabled' : ''} /> min</label>
                <button class="btn-small btn-outline" data-pomo-apply>Appliquer</button>
              </div>
            </div>
          </div>

          <div class="card">
            <div class="card-title">Dernières activités</div>
            ${state.sessions.slice(-5).reverse().map(s => {
              const topic = state.topics.find(t => t.id === s.topic_id);
              return `
                <div class="stat-row">
                  <span class="label">${s.type || 'Session'}</span>
                  <span class="text-small">${topic ? topic.title : ''} ${s.duration ? '• ' + s.duration + 'm' : ''}</span>
                </div>
              `;
            }).join('') || '<div class="text-muted text-small">Aucune activité récente</div>'}
          </div>
        </div>
      `;
    }

    // ----- MASTER -----

      return `
        <div>
          <h2 style="font-size:22px;margin-bottom:16px;">📚 Master APCE — S1</h2>
          <div class="subject-grid">
            ${state.subjects.map(s => `
              <div class="subject-card" data-subject-id="${s.id}">

              </div>

    function renderSubject() {
      const sub = state.subjects.find(s => s.id === state.subjectId);

      return `
        <div>
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px;">

            ${tops.map(t => {
              const p = getProgress(t.id);
              const score = p.score || computeMasteryScore(t.id);
              return `
                <div class="topic-item" data-topic-id="${t.id}">
                  <div class="left">
                    <span class="name">${t.title}</span>
                    <span class="sub">${getLevelLabel(p.level)} • Score ${score}%</span>
                  </div>
                  <div class="right">
                    <span class="${getStatusClass(p.level)}">●</span>

                    <button class="btn-small btn-outline" data-topic-up="${t.id}">+</button>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function renderTopic() {
      const topic = state.topics.find(t => t.id === state.topicId);

      const p = getProgress(topic.id);

      return `
        <div>
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px;">
            <button class="btn-outline btn-small" data-route="subject" data-subject-id="${topic.subject_id}">← Retour</button>

          <div class="card">
            <div class="card-title">Maîtrise <span class="badge">${getLevelLabel(p.level)}</span></div>
            <div class="flex-between">
              <span>Score : ${score}%</span>
              <span>Dernière étude : ${p.last_studied ? new Date(p.last_studied).toLocaleDateString('fr-FR') : 'jamais'}</span>

            <div class="progress-bar"><div class="fill" style="width:${score}%;"></div></div>
            <div style="margin-top:12px;display:flex;gap:8px;justify-content:center;">
              <button class="btn-small btn-outline" data-topic-down="${topic.id}">−</button>
              <button class="btn-small btn-outline" data-topic-up="${topic.id}">+</button>
              <button class="btn-small btn-outline" data-session-topic="${topic.id}">📝 Session</button>
            </div>
          </div>
          <div class="card">
            <div class="card-title">Notes</div>
            <textarea id="topic-notes" rows="3">${p.notes || ''}</textarea>
            <button class="btn-primary btn-small mt-8" data-save-notes="${topic.id}">Enregistrer</button>
          </div>
        </div>
      `;
    }

    // ----- PROGRAMMING -----
    function renderProgramming() {
      const groups = {};

      const emojis = { 'Frontend': '🌐', 'Python & Data': '🐍', 'Java & C': '☕', 'Outils & Projets': '🚀' };

      PROGRAMMING_TOPICS.forEach(t => {
        if (!groups[t.domain]) groups[t.domain] = [];
        groups[t.domain].push(t);
      });

      return `
        <div>
          <h2 style="font-size:22px;margin-bottom:16px;">💻 Mon Plan de Programmation</h2>
          ${order.filter(key => groups[key]).map(key => `
            <div class="prog-category">
              <div class="cat-header">
                <span class="cat-icon">${emojis[key] || '📘'}</span>
                ${key}
                <span class="cat-count">${groups[key].length} sujets</span>
              </div>
              ${groups[key].map(t => {
                const p = state.programming[t.id] || { level: 0, score: 0 };
                return `
                  <div class="topic-item">
                    <div class="left">
                      <span class="name">${t.title}</span>
                      <span class="sub">${getLevelLabel(p.level)}</span>
                    </div>
                    <div class="right">
                      <span class="${getStatusClass(p.level)}">●</span>
                      <button class="btn-small btn-outline" data-prog-down="${t.id}">−</button>
                      <button class="btn-small btn-outline" data-prog-up="${t.id}">+</button>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          `).join('')}
        </div>
      `;

          </div>

          <div class="card">
            <div class="card-title">Planning hebdomadaire</div>

              <div class="stat-row">

          <div class="card">
            <div class="card-title">📋 Mes tâches <span class="badge">${new Date().toLocaleDateString('fr-FR')}</span></div>
            ${todayTasks.length ? todayTasks.map(t => `
              <div class="task-item">
                <div class="task-left">
                  <span class="task-text ${t.isDone ? 'task-done' : ''}">${t.text}</span>
                  <span class="task-meta">${t.time || ''} • ${t.priority}</span>
                </div>
                <div class="task-right">
                  <span class="task-priority ${t.priority}">${t.priority}</span>
                  ${!t.isDone ? `<button class="btn-small btn-outline" data-task-done="${t.id}">✅</button>` : ''}
                  <button class="btn-small btn-outline" data-task-delete="${t.id}">🗑️</button>
                </div>
              </div>
            `).join('') : '<div class="text-muted text-small">Aucune tâche pour aujourd\'hui.</div>'}
            <button class="btn-primary btn-small mt-8" data-add-task>➕ Ajouter une tâche</button>
          </div>

          <div class="card">
            <div class="card-title">📝 Mes examens <span class="badge">${state.exams.length}</span></div>
            ${state.exams.length ? state.exams.map(e => `
              <div class="exam-item">
                <div class="exam-left">
                  <span class="exam-title">${e.title}</span>
                  <span class="exam-date">📅 ${new Date(e.date).toLocaleDateString('fr-FR')} ${e.time ? 'à '+e.time : ''}</span>
                </div>
                <div class="exam-right">
                  <span class="exam-badge">À venir</span>
                  <button class="btn-small btn-outline" data-delete-exam="${e.id}">🗑️</button>
                </div>

            `).join('') : '<div class="text-muted text-small">Aucun examen enregistré.</div>'}

          </div>
        </div>
      `;

    // ----- STATS -----
    function renderStats() {
      const totalSessions = state.sessions.length;
      const totalTopics = state.topics.length;
      const progressed = state.topics.filter(t => getProgress(t.id).level > 0).length;
      let totalMinutes = 0;
      state.sessions.forEach(s => { totalMinutes += (s.duration || 0); });
      const totalHours = Math.round(totalMinutes / 60 * 10) / 10;

      let bestSubject = null, bestPercent = -1;
      let worstSubject = null, worstPercent = 101;
      state.subjects.forEach(s => {
        const p = getSubjectProgress(s.id);
        if (p > bestPercent) { bestPercent = p; bestSubject = s; }
        if (p < worstPercent) { worstPercent = p; worstSubject = s; }
      });

      const typeCount = {};
      state.sessions.forEach(s => {
        const t = s.type || 'other';
        typeCount[t] = (typeCount[t] || 0) + 1;
      });
      const typeLabels = { 'theory': 'Théorie', 'exercise': 'Exercices', 'revision': 'Révision', 'test': 'Tests', 'project': 'Projets', 'other': 'Autre' };

      let progDone = 0;
      PROGRAMMING_TOPICS.forEach(t => {
        const p = state.programming[t.id] || { level: 0 };
        if (p.level >= 2) progDone++;
      });
      const progPercent = PROGRAMMING_TOPICS.length ? Math.round((progDone / PROGRAMMING_TOPICS.length) * 100) : 0;

      return `
        <div>
          <h2 style="font-size:22px;margin-bottom:16px;">📈 Tableau de Bord Statistique</h2>

          <div class="card">
            <div class="card-title">Aperçu général</div>
            <div class="stat-row"><span class="label">⏱️ Temps d'étude total</span><span class="value">${totalHours} heures</span></div>
            <div class="stat-row"><span class="label">📚 Sessions enregistrées</span><span class="value">${totalSessions}</span></div>
            <div class="stat-row"><span class="label">📖 Chapitres entamés</span><span class="value">${progressed} / ${totalTopics}</span></div>
            <div class="stat-row"><span class="label">🏆 Progression globale</span><span class="value">${totalTopics ? Math.round((progressed/totalTopics)*100) : 0}%</span></div>
            <div class="stat-row" style="border-bottom:0; margin-top:8px; padding-top:8px; border-top:1px solid #1a2430;">
              <span class="label">🥇 Matière forte</span>
              <span class="value">${bestSubject ? bestSubject.name + ' (' + bestPercent + '%)' : '—'}</span>
            </div>
            <div class="stat-row" style="border-bottom:0;">
              <span class="label">⚠️ Matière faible</span>
              <span class="value">${worstSubject ? worstSubject.name + ' (' + worstPercent + '%)' : '—'}</span>
            </div>
          </div>

          <div class="card">
            <div class="card-title">Progression par matière <span class="badge">S1</span></div>
            ${state.subjects.map(s => {
              const p = getSubjectProgress(s.id);
              return `
                <div style="margin-bottom:12px;">
                  <div class="flex-between text-small"><span>${s.name}</span><span>${p}%</span></div>
                  <div class="progress-bar"><div class="fill" style="width:${p}%;${p<30?'background:#e86a6a;':p<60?'background:#e8cc6a;':'background:#6ae8a5;'}"></div></div>
                </div>
              `;
            }).join('')}
          </div>

          <div class="card">
            <div class="card-title">Progression Programmation <span class="badge">${progPercent}%</span></div>
            <div class="progress-bar"><div class="fill" style="width:${progPercent}%;"></div></div>
            <div class="flex-between text-small mt-8"><span>${progDone} / ${PROGRAMMING_TOPICS.length} sujets maîtrisés</span></div>
          </div>

          <div class="card">
            <div class="card-title">Répartition des sessions</div>
            ${Object.keys(typeCount).length > 0 ? 
              Object.keys(typeCount).map(key => `
                <div class="stat-row"><span class="label">${typeLabels[key] || key}</span><span class="value">${typeCount[key]} session${typeCount[key] > 1 ? 's' : ''}</span></div>
              `).join('') 
              : '<div class="text-muted text-small">Aucune session enregistrée</div>'}
          </div>
        </div>
      `;
    }

              </div>

    function renderModal() {

      const m = state.modal;
      if (m.type === 'folder') {
        return `
          <div class="modal-overlay">
            <div class="modal-content">
              <span class="close-btn" data-close-modal>❌</span>

    // ---------- POMODORO CONTROLS ----------
    function startPomodoro() {
      if (pomodoro.isRunning) return;
      pomodoro.isRunning = true;
      if (pomodoro.remaining <= 0) {
        pomodoro.remaining = pomodoro.isBreak ? pomodoro.breakTime * 60 : pomodoro.workTime * 60;
      }
      pomodoro.timerId = setInterval(() => {
        pomodoro.remaining--;
        if (pomodoro.remaining <= 0) {
          clearInterval(pomodoro.timerId);
          pomodoro.isRunning = false;
          pomodoro.isBreak = !pomodoro.isBreak;
          pomodoro.remaining = pomodoro.isBreak ? pomodoro.breakTime * 60 : pomodoro.workTime * 60;
          if (navigator.vibrate) navigator.vibrate(200);
          alert(pomodoro.isBreak ? '☕ Pause terminée ! Reprenez le travail.' : '⏰ Temps de travail terminé ! Faites une pause.');
          render();
        }
        render();
      }, 1000);
      render();
    }

    function pausePomodoro() {
      if (!pomodoro.isRunning) return;
      clearInterval(pomodoro.timerId);
      pomodoro.isRunning = false;
      render();
    }

    function stopPomodoro() {
      clearInterval(pomodoro.timerId);
      pomodoro.isRunning = false;
      pomodoro.isBreak = false;
      pomodoro.remaining = pomodoro.workTime * 60;
      render();
    }

    function resetPomodoro() {
      clearInterval(pomodoro.timerId);
      pomodoro.isRunning = false;
      pomodoro.isBreak = false;
      pomodoro.remaining = pomodoro.workTime * 60;
      render();
    }

    function applyPomodoroSettings() {
      if (pomodoro.isRunning) return;
      const work = parseInt(document.getElementById('pomo-work').value);
      const breakTime = parseInt(document.getElementById('pomo-break').value);
      if (work > 0 && breakTime > 0) {
        pomodoro.workTime = work;
        pomodoro.breakTime = breakTime;
        pomodoro.remaining = work * 60;
        pomodoro.isBreak = false;
        render();
      }
    }

    // ---------- EVENTS ----------

      document.querySelectorAll('.topic-item[data-topic-id]').forEach(el => {

      });

        e.stopPropagation();
        state.isSettingsOpen = !state.isSettingsOpen;
        const menu = document.getElementById('settings-menu');
        if (menu) menu.classList.toggle('open');
      });
      document.addEventListener('click', (e) => {
        const menu = document.getElementById('settings-menu');
        const trigger = document.getElementById('settings-trigger');
        if (menu && menu.classList.contains('open') && !menu.contains(e.target) && !trigger.contains(e.target)) {
          state.isSettingsOpen = false;
          menu.classList.remove('open');
        }
      });

      // ----- SETTINGS ITEMS -----

          render();
        });
      });

      document.querySelectorAll('[data-setting]').forEach(el => {
        el.addEventListener('click', () => {
          const setting = el.dataset.setting;
          if (setting === 'theme') {
            state.settings.theme = state.settings.theme === 'dark' ? 'light' : 'dark';
            document.body.style.background = state.settings.theme === 'dark' ? '#0a0e14' : '#f0f4f8';
            document.body.style.color = state.settings.theme === 'dark' ? '#e2e8f0' : '#1a202c';
          } else if (setting === 'showSmartRevision') {
            state.settings.showSmartRevision = !state.settings.showSmartRevision;
          }
          state.isSettingsOpen = false;
          document.getElementById('settings-menu')?.classList.remove('open');
          saveState();
          render();
        });
      });

      // ----- RESOURCE FOLDER EVENTS -----
      document.querySelectorAll('[data-add-folder]').forEach(el => {
        el.addEventListener('click', () => {
          state.modal = { type: 'folder' };
          render();
        });
      });
      document.querySelectorAll('[data-save-folder]').forEach(el => {
        el.addEventListener('click', () => {
          const subjectId = document.getElementById('folder-subject')?.value;
          const folderName = document.getElementById('folder-name')?.value;
          if (!subjectId || !folderName) { alert('Veuillez remplir tous les champs.'); return; }
          if (!state.resources[subjectId]) state.resources[subjectId] = {};
          if (state.resources[subjectId][folderName]) { alert('Ce dossier existe déjà.'); return; }
          state.resources[subjectId][folderName] = [];
          state.modal = null;
          saveState();
          render();
        });
      });

      // ----- RESOURCE EVENTS (Centralized + Folders) -----
      document.querySelectorAll('[data-filter-tag]').forEach(el => {
        el.addEventListener('click', () => {
          state.resourceFilter = el.dataset.filterTag;
          render();
        });
      });

      document.querySelectorAll('[data-move-resource]').forEach(el => {
        el.addEventListener('change', (e) => {
          const data = el.dataset.moveResource.split('|');
          const subjectId = data[0];
          const resourceId = data[1];
          const newFolder = e.target.value;
          if (!newFolder) return;

          // Find and remove from current folder
          let resourceToMove = null;
          const folders = state.resources[subjectId] || {};
          Object.keys(folders).forEach(folderName => {
            const index = folders[folderName].findIndex(r => r.id === resourceId);
            if (index !== -1) {
              resourceToMove = folders[folderName][index];
              folders[folderName].splice(index, 1);
            }
          });

          // Add to new folder
          if (resourceToMove) {
            if (!state.resources[subjectId][newFolder]) state.resources[subjectId][newFolder] = [];
            state.resources[subjectId][newFolder].push(resourceToMove);
          }
          saveState();
          render();
        });
      });

      document.querySelectorAll('[data-add-resource]').forEach(el => {
        el.addEventListener('click', () => {
          state.modal = { type: 'resource' };
          render();
        });
      });
      
      document.getElementById('resource-file')?.addEventListener('change', (e) => {
        const file = e.target.files[0];

          const urlInput = document.getElementById('resource-url');
          urlInput.value = URL.createObjectURL(file);
          urlInput.placeholder = 'Fichier chargé : ' + file.name;
        }
      });

      document.querySelectorAll('[data-save-resource]').forEach(el => {
        el.addEventListener('click', () => {
          const subjectId = document.getElementById('resource-subject')?.value;

          const title = document.getElementById('resource-title')?.value;
          const tag = document.getElementById('resource-tag')?.value || '📚 Autres';
          const url = document.getElementById('resource-url')?.value;
          if (!subjectId || !title || !url) { alert('Veuillez remplir tous les champs.'); return; }
          
          if (!state.resources[subjectId]) state.resources[subjectId] = {};
          if (!state.resources[subjectId][folderName]) state.resources[subjectId][folderName] = [];
          
          state.resources[subjectId][folderName].push({
            id: generateId(),
            title: title,
            url: url,
            tag: tag,
            dateAdded: new Date().toISOString().slice(0,10)
          });
          state.modal = null;
          saveState();
          render();
        });
      });
      document.querySelectorAll('[data-delete-resource]').forEach(el => {
        el.addEventListener('click', (e) => {
          e.stopPropagation();
          const data = el.dataset.deleteResource.split('|');
          const subjectId = data[0];
          const resourceId = data[1];
          if (confirm('Supprimer cette ressource ?')) {
            const folders = state.resources[subjectId] || {};
            Object.keys(folders).forEach(folderName => {
              folders[folderName] = folders[folderName].filter(r => r.id !== resourceId);
            });
            saveState();
            render();
          }
        });
      });

      // ----- MASTER / TOPIC EVENTS -----

          e.stopPropagation();
          const tid = el.dataset.topicUp;

            p.level = p.level + 1;
            p.score = computeMasteryScore(tid);
            p.last_studied = new Date().toISOString();
            state.progress[tid] = p;
            saveState();
            render();
          }
        });
      });
      document.querySelectorAll('[data-topic-down]').forEach(el => {
        el.addEventListener('click', (e) => {
          e.stopPropagation();
          const tid = el.dataset.topicDown;

            p.level = p.level - 1;
            p.score = computeMasteryScore(tid);

            saveState();
            render();
          }

            state.programming[pid] = p;
            saveState();
            render();
          }

      document.querySelectorAll('[data-prog-down]').forEach(el => {

            saveState();
            render();

          render();

            item.style.transition = 'opacity 0.3s ease, transform 0.3s ease';

            setTimeout(() => {

                const remainingItems = groupBody.querySelectorAll('.revision-item');

                  const group = groupBody.closest('.revision-group');

        el.addEventListener('click', () => { state.isEditingPlanning = true; render(); });
      });
      document.querySelectorAll('[data-save-planning]').forEach(el => {
        el.addEventListener('click', () => {
          const dayKeys = ['lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi', 'dimanche'];
          const newSchedule = {};
          dayKeys.forEach(key => {
            const input = document.getElementById(`planning-input-${key}`);
            if (input) newSchedule[key] = input.value.trim();
          });
          state.customSchedule = newSchedule;
          state.isEditingPlanning = false;
          saveState();
          render();
        });
      });
      document.querySelectorAll('[data-cancel-planning]').forEach(el => {
        el.addEventListener('click', () => { state.isEditingPlanning = false; render(); });
      });
      document.querySelectorAll('[data-reset-day]').forEach(el => {
        el.addEventListener('click', (e) => {
          const key = el.dataset.resetDay;
          const input = document.getElementById(`planning-input-${key}`);
          if (input) input.value = DEFAULT_SCHEDULE[key] || '';
        });
      });
      document.querySelectorAll('[data-save-session]').forEach(el => {
        el.addEventListener('click', () => {
          const topicId = document.getElementById('session-topic')?.value;
          const type = document.getElementById('session-type')?.value || 'other';
          const duration = parseInt(document.getElementById('session-duration')?.value) || 0;
          const date = document.getElementById('session-date')?.value || new Date().toISOString().slice(0,10);
          const notes = document.getElementById('session-notes')?.value || '';
          if (!topicId) { alert('Sélectionnez un chapitre'); return; }
          const session = {
            id: generateId(),
            date, start: null, end: null, duration,
            subject_id: state.topics.find(t=>t.id===topicId)?.subject_id || '',
            topic_id: topicId, type, notes
          };
          state.sessions.push(session);
          if (type === 'exercise' || type === 'test') {
            const p = getProgress(topicId);
            const oldScore = p.score || computeMasteryScore(topicId);
            p.score = Math.min(oldScore + 5, 100);
            if (p.level === 0 && p.score > 20) p.level = 1;
            else if (p.level === 1 && p.score > 45) p.level = 2;
            else if (p.level === 2 && p.score > 70) p.level = 3;
            else if (p.level === 3 && p.score > 90) p.level = 4;
            p.last_studied = new Date().toISOString();
            state.progress[topicId] = p;
          } else {
            const p = getProgress(topicId);
            p.last_studied = new Date().toISOString();
            state.progress[topicId] = p;
          }
          delete state.ignoredTopics[topicId];
          state.modal = null;
          saveState();
          render();
        });
      });
      document.querySelectorAll('[data-add-mistake]').forEach(el => {
        el.addEventListener('click', () => { state.modal = { type: 'mistake' }; render(); });
      });
      document.querySelectorAll('[data-save-mistake]').forEach(el => {
        el.addEventListener('click', () => {
          const problem = document.getElementById('mistake-problem')?.value || '';
          const detail = document.getElementById('mistake-detail')?.value || '';
          const correction = document.getElementById('mistake-correction')?.value || '';
          const cause = document.getElementById('mistake-cause')?.value || 'other';
          if (!problem) { alert('Décrivez l\'erreur'); return; }
          state.errors.push({
            id: generateId(), problem, mistake: detail, correction, cause,
            status: 'à revoir', confidence: 3, date: new Date().toISOString()
          });
          state.modal = null;
          saveState();
          render();
        });
      });
      document.querySelectorAll('[data-close-modal]').forEach(el => {
        el.addEventListener('click', () => { state.modal = null; render(); });
      });
    }

    // ---------- DATA PERSISTENCE ----------
    async function saveState() {
      const data = {
        subjects: state.subjects,
        topics: state.topics,
        progress: state.progress,
        sessions: state.sessions,
        errors: state.errors,
        programming: state.programming,
        tasks: state.tasks,
        exams: state.exams,
        resources: state.resources,
        ignoredTopics: state.ignoredTopics,
        settings: state.settings,
        onboardingDone: state.onboardingDone,
        customSchedule: state.customSchedule
      };
      await dbSet('appState', data);
    }

    async function loadState() {
      try {
        const data = await dbGet('appState');
        if (data) {
          state.subjects = data.subjects || MASTER_SUBJECTS;
          state.topics = data.topics || TOPICS_SEED;
          state.progress = data.progress || {};
          state.sessions = data.sessions || [];
          state.errors = data.errors || [];
          state.programming = data.programming || {};
          state.tasks = data.tasks || [];
          state.exams = data.exams || [];
          state.resources = data.resources || {};
          state.ignoredTopics = data.ignoredTopics || {};
          state.settings = data.settings || { theme: 'dark', showSmartRevision: true };
          state.onboardingDone = data.onboardingDone || false;
          state.customSchedule = data.customSchedule || {};
        } else {
          state.subjects = MASTER_SUBJECTS;
          state.topics = TOPICS_SEED;
          state.progress = {};
          state.sessions = [];
          state.errors = [];
          state.programming = {};
          state.tasks = [];
          state.exams = [];
          state.resources = {};
          state.ignoredTopics = {};
          state.settings = { theme: 'dark', showSmartRevision: true };
          state.onboardingDone = false;
          state.customSchedule = {};
        }
      } catch (e) {
        console.warn('Erreur chargement state', e);
      }
    }

    // ---------- REMINDER LOOP ----------
    setInterval(() => {
      if (state.onboardingDone) {
        checkReminders();
      }
    }, 60000);

    // ---------- INIT ----------
    async function init() {
      await openDB();
      await loadState();
      // Apply theme on load
      document.body.style.background = state.settings.theme === 'dark' ? '#0a0e14' : '#f0f4f8';
      document.body.style.color = state.settings.theme === 'dark' ? '#e2e8f0' : '#1a202c';
      render();
      if (Notification.permission === 'default') {
        Notification.requestPermission();
      }
    }

    init();

  })();
</script>
</body>
</html>
